services:
  lifecanvas:
    build: .
    image: lifecanvas-os:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LIFECANVAS_ALLOWED_HOSTS: ${LIFECANVAS_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - lifecanvas-data:/srv/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  lifecanvas-data:
